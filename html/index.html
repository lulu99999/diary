<!DOCTYPE html>
<html lang="zh-CN" data-skin="creamy" data-dark="false">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#FDFCF8" />
  <title>拾光 · 私人日记</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="toast" class="toast hidden"></div>

<div id="splash" class="fullscreen">
  <div class="text-center animate-in splash-hero">
    <div class="splash-logo" id="splash-icon"></div>
    <h1 class="splash-title">拾光</h1>
    <p class="splash-tagline">记录生活中的每一束光</p>
  </div>
</div>

<div id="enter-gate" class="fullscreen hidden">
  <div class="phone-shell enter-panel">
    <div class="splash-logo" id="enter-icon"></div>
    <h1 class="splash-title splash-title-enter">拾光</h1>
    <p class="splash-tagline">记录生活中的每一束光</p>
    <button type="button" class="btn-primary" id="btn-enter">进入拾光</button>
  </div>
</div>

<div id="lock-screen" class="fullscreen hidden">
  <div class="phone-shell">
    <div class="lock-body safe-top">
      <div class="lock-icon" id="lock-icon"></div>
      <h2 class="lock-title">解锁个人空间</h2>
      <div class="pass-dots" id="pass-dots">
        <div class="pass-dot"></div>
        <div class="pass-dot"></div>
        <div class="pass-dot"></div>
        <div class="pass-dot"></div>
      </div>
      <div class="keypad" id="keypad"></div>
    </div>
  </div>
</div>

<div id="app" class="phone-shell hidden">
  <header class="header safe-top">
    <button type="button" class="icon-round" id="btn-menu" aria-label="设置"></button>
    <span class="header-title" id="header-title">拾光</span>
    <button type="button" class="icon-round" id="btn-dark" aria-label="深色模式"></button>
  </header>
  <main class="main-scroll" id="main-content"></main>
  <nav class="bottom-nav safe-bottom hidden" id="bottom-nav">
    <button type="button" class="nav-btn nav-btn-labeled" data-nav="diary" id="nav-diary" aria-label="日记"></button>
    <button type="button" class="btn-fab" id="btn-plus" aria-label="写日记"></button>
    <button type="button" class="nav-btn nav-btn-labeled" data-view="mood_stats" id="nav-stats" aria-label="统计"></button>
  </nav>
</div>

<div id="sidebar" class="sidebar-mask hidden">
  <aside class="sidebar-panel safe-top safe-bottom" id="sidebar-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <span class="sidebar-title">设置</span>
      <button type="button" class="icon-round" id="btn-sidebar-close" aria-label="关闭"></button>
    </div>
    <p class="sidebar-section">个性化皮肤</p>
    <div class="skin-grid cols-2">
      <button type="button" class="skin-btn active" data-skin="creamy">奶油杏</button>
      <button type="button" class="skin-btn" data-skin="sakura">落樱粉</button>
      <button type="button" class="skin-btn" data-skin="ocean">海盐蓝</button>
      <button type="button" class="skin-btn" data-skin="dusk">暮光紫</button>
    </div>
    <p class="sidebar-section">密码锁</p>
    <label class="toggle-row">
      <span>进入时要求密码</span>
      <span class="switch">
        <input type="checkbox" id="toggle-pass" />
        <span class="switch-slider" aria-hidden="true"></span>
      </span>
    </label>
    <div id="pass-setup" class="pass-setup hidden">
      <p class="sidebar-hint pass-hint">开启后设置 4 位数字密码，点击保存即可生效</p>
      <input type="password" class="sidebar-input" id="new-pass" maxlength="4" placeholder="4 位数字密码" inputmode="numeric" autocomplete="new-password" />
      <button type="button" class="sidebar-btn primary" id="btn-save-pass">保存并开启</button>
    </div>
    <p class="sidebar-section">数据管理</p>
    <p class="sidebar-hint">数据按本设备保存，升级功能后旧日记会自动保留。建议偶尔「导出备份」。</p>
    <p class="sidebar-hint" id="device-id-hint" style="font-size:0.6rem;word-break:break-all"></p>
    <button type="button" class="sidebar-btn sidebar-btn-with-icon" id="btn-export"></button>
    <button type="button" class="sidebar-btn sidebar-btn-with-icon" id="btn-import"></button>
    <p class="sidebar-hint">导入会覆盖本设备全部日记，请先导出备份。</p>
    <input type="file" id="import-file" accept=".json" class="hidden" />
    <button type="button" class="sidebar-btn danger" id="btn-clear">清空所有日记</button>
    <button type="button" class="sidebar-btn danger" id="btn-lock" style="margin-top:auto"></button>
  </aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
</div>

<div id="year-picker-root" class="hidden"></div>

<input type="file" id="file-camera" accept="image/*" capture="environment" class="hidden" />
<input type="file" id="file-album" accept="image/*" multiple class="hidden" />

<div id="image-viewer" class="image-viewer hidden" role="dialog" aria-modal="true" aria-label="查看图片">
  <div class="image-viewer-backdrop" data-action="close-image-viewer"></div>
  <button type="button" class="image-viewer-close icon-round" id="image-viewer-close" data-action="close-image-viewer" aria-label="关闭"></button>
  <button type="button" class="image-viewer-nav prev hidden" id="image-viewer-prev" data-action="viewer-prev" aria-label="上一张"></button>
  <button type="button" class="image-viewer-nav next hidden" id="image-viewer-next" data-action="viewer-next" aria-label="下一张"></button>
  <div class="image-viewer-body">
    <img id="image-viewer-img" alt="" />
  </div>
  <span class="image-viewer-counter hidden" id="image-viewer-counter"></span>
</div>

<div id="photo-sheet" class="sheet-mask hidden">
  <div class="sheet-panel" id="photo-sheet-panel">
    <p class="sheet-title">添加照片</p>
    <button type="button" class="sheet-btn" data-action="pick-camera" id="sheet-btn-camera"></button>
    <button type="button" class="sheet-btn" data-action="pick-album" id="sheet-btn-album"></button>
    <button type="button" class="sheet-btn" data-action="pick-url" id="sheet-btn-url"></button>
    <button type="button" class="sheet-btn cancel" data-action="close-photo-sheet">取消</button>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/storage.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
